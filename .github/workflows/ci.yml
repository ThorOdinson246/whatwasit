name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: minilm-onnx-${{ runner.os }}-${{ hashFiles('hist/embedder.py', 'pyproject.toml') }}

      - name: Install package and test deps
        run: pip install -e ".[dev]"

      - name: Prefetch ONNX embedding model
        run: |
          python - <<'PY'
          from hist.config import Config
          from hist.embedder import build_embedder
          build_embedder(Config.default()).encode(["warmup"])
          PY

      - name: Run tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest --cov=hist --cov-report=term-missing

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build backend
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Smoke-test wheel install
        run: |
          pip install dist/*.whl
          hist --help
          python -c "import hist; print(hist.__version__)"
