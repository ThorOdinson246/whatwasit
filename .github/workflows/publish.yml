name: Publish to PyPI

# Publishes to PyPI when you bump the version and push to main, or when you
# publish a GitHub Release (either path works).
#
# One-time setup:
#   1. PyPI → API tokens → scope "whatwasit" → copy token
#   2. GitHub → Settings → Secrets → Actions → PYPI_API_TOKEN
#
# Auto-publish flow (recommended):
#   1. Bump version in pyproject.toml and whatwasit/__init__.py
#   2. git commit && git push origin main
#   → workflow detects the version bump, publishes, and creates tag vX.Y.Z

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - whatwasit/__init__.py
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide whether to publish
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plan publish
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          read_version() {
            python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          }

          read_init_version() {
            python - <<'PY'
          import pathlib, re
          text = pathlib.Path("whatwasit/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', text)
          if not match:
              raise SystemExit("Could not read __version__ from whatwasit/__init__.py")
          print(match.group(1))
          PY
          }

          CURRENT="$(read_version)"
          INIT="$(read_init_version)"

          if [ "$CURRENT" != "$INIT" ]; then
            echo "::error::pyproject.toml version ($CURRENT) != whatwasit/__init__.py ($INIT)"
            exit 1
          fi

          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "release" ]; then
            TAG_VERSION="${RELEASE_TAG#v}"
            if [ "$TAG_VERSION" != "$CURRENT" ]; then
              echo "::error::Release tag $RELEASE_TAG does not match package version $CURRENT"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing from GitHub Release $RELEASE_TAG"
            exit 0
          fi

          PREVIOUS="$(git show HEAD~1:pyproject.toml 2>/dev/null | python - <<'PY' || true
          import sys, tomllib
          data = sys.stdin.buffer.read()
          if not data:
              raise SystemExit(0)
          print(tomllib.loads(data)["project"]["version"])
          PY
          )"

          if [ -z "$PREVIOUS" ]; then
            echo "No previous pyproject.toml on parent commit; skipping auto-publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$PREVIOUS" = "$CURRENT" ]; then
            echo "Version unchanged ($CURRENT); skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if curl -fsS "https://pypi.org/pypi/whatwasit/$CURRENT/json" >/dev/null; then
            echo "Version $CURRENT already on PyPI; skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version bumped $PREVIOUS -> $CURRENT; will publish"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create release tag
        if: github.event_name == 'push'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping tag creation"
            exit 0
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
