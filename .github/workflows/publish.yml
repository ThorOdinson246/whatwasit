name: Publish to PyPI

# Publishes when you create a GitHub Release (tag must be vX.Y.Z matching pyproject.toml).
#
# One-time PyPI setup (trusted publishing — no API token in GitHub secrets):
#   1. https://pypi.org/manage/account/publishing/
#   2. Add publisher: PyPI project name hist-search, Owner ThorOdinson246, repo hist,
#      workflow publish.yml, environment pypi
#   3. GitHub repo → Settings → Environments → New environment "pypi"
#
# Release flow:
#   1. Bump version in pyproject.toml and hist/__init__.py
#   2. Commit, push main
#   3. git tag v0.1.0 && git push origin v0.1.0
#   4. GitHub → Releases → Draft new release → pick tag v0.1.0 → Publish release

on:
  release:
    types: [published]

permissions:
  id-token: write

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hist-search
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          PKG_VERSION=$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ${TAG} (version ${VERSION}) does not match pyproject.toml (${PKG_VERSION})"
            exit 1
          fi

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
