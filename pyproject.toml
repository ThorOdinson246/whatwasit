[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hist"
version = "0.1.0"
description = "Local-first semantic search for your shell history. Search by intent, not exact text. No cloud, no API keys."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hist contributors" }]
keywords = ["shell", "history", "semantic-search", "embeddings", "cli", "local-first", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

dependencies = [
    "fastembed>=0.3.0",
    "usearch>=2.12.0",
    "numpy>=1.24",
    "rich>=13.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
hist = "hist.cli:main"

[project.urls]
Homepage = "https://github.com/example/hist"
Repository = "https://github.com/example/hist"

[tool.hatch.build.targets.wheel]
packages = ["hist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
