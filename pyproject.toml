[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whatwasit"
version = "0.1.0"
description = "Local-first semantic search for your shell history. Search by intent, not exact text. No cloud, no API keys."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "ThorOdinson246", email = "110178596+ThorOdinson246@users.noreply.github.com" }]
keywords = ["shell", "history", "semantic-search", "embeddings", "cli", "local-first", "privacy", "whatwasit", "shell-history"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]

dependencies = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface-hub>=0.23",
    "usearch>=2.12.0",
    "numpy>=1.24",
    "rich>=13.0",
    "textual>=0.40",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
whatwasit = "whatwasit.cli:main"

[project.urls]
Homepage = "https://github.com/ThorOdinson246/whatwasit"
Repository = "https://github.com/ThorOdinson246/whatwasit"
Issues = "https://github.com/ThorOdinson246/whatwasit/issues"

[tool.hatch.build.targets.wheel]
packages = ["whatwasit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
